name: Gerar textura da Lua (temporário)
on:
  push:
    branches: [claude/lua-natural]
    paths: [scripts/generate-moon-surface.py, .github/workflows/moon-texture.yml]
permissions:
  contents: write
jobs:
  texture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow numpy tifffile imagecodecs
      - run: python scripts/generate-moon-surface.py
      - name: Gravar no branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/assets/moon-surface-hd.webp
          git diff --cached --quiet || git commit -m "Textura da Lua em alta definição (NASA SVS)"
          git push
