name: Publicar função Supabase

# Publica uma função de supabase/functions direto do repositório (main), sem copiar código à mão.
# Só por disparo manual: migrations vêm antes das funções e a interface depois (AGENTS.md), então a
# ordem continua sendo decisão de quem publica. Exige o segredo SUPABASE_ACCESS_TOKEN (token pessoal
# do Supabase, Account → Access Tokens); verify_jwt de cada função vem de supabase/config.toml.
on:
  workflow_dispatch:
    inputs:
      function:
        description: Função a publicar
        required: true
        type: choice
        options:
          - push-process
          - push-subscriptions
          - push-send
          - station-now
          - met-forecast
          - account-preferences
          - account-delete
          - environment-refresh
          - forecast-verify
          - lightning

permissions:
  contents: read

concurrency:
  group: deploy-function-${{ inputs.function }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Publicar
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FUNCTION: ${{ inputs.function }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "Falta o segredo SUPABASE_ACCESS_TOKEN no repositório."; exit 1; fi
          supabase functions deploy "$FUNCTION" --project-ref dszyyrcvwrpyiypwyvxe --use-api
