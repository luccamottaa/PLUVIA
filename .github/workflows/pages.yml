name: Publicar PLUVIA no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerar páginas públicas de cidades
        run: node scripts/generate-city-pages.cjs
      - name: Validar regras críticas do PLUVIA
        run: node --test tests/*.test.cjs
      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar os arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # 625 páginas municipais levam mais tempo para sincronizar no GitHub Pages.
          # Aumenta a janela sem alterar o conteúdo nem relaxar as verificações.
          timeout: 1800000
  verify-build:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validar HTML, Service Worker e integridade dos assets do build
        run: node scripts/check-release.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar navegador isolado
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Testar experiência visual no build publicado
        env:
          PLUVIA_PREVIEW_URL: http://127.0.0.1:4173/
          PLUVIA_QA_OUTPUT: /tmp/pluvia-build-qa
        run: |
          python -m http.server 4173 --directory dist >/tmp/pluvia-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          python scripts/verify-weather-icons.py
          python scripts/verify-visual.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pluvia-build-visual-qa
          path: /tmp/pluvia-build-qa
          retention-days: 7
