name: Validar PLUVIA antes do merge
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verificar sintaxe
        run: |
          for file in dist/*.js dist/modules/*.js; do node --check "$file" || exit; done
      - name: Testar regras e regressões
        run: node --test tests/*.test.cjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.0
      - name: Verificar tipos das funções Supabase
        # --node-modules-dir=none: com o package.json da raiz o Deno procurava os pacotes npm dos tipos do
        # Supabase (desde a functions-js 2.119.0, npm:openai) num node_modules local que não existe.
        run: deno check --node-modules-dir=none supabase/functions/*/index.ts supabase/functions/met-forecast/index.js supabase/functions/station-now/index.js supabase/functions/lightning/index.js
